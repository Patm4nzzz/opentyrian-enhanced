[workspace]
resolver = "2"
members = [
    "crates/tyrian-formats",
    "crates/tyrian-sim",
    "crates/tyrian-mods",
    "crates/tyrian-import",
    "crates/tyrian-golden",
    "crates/tyrian-godot",
    "crates/tyrian-robustness",
    "crates/tyrian-render",
    "crates/tyrian-dodge-bot",
]

[workspace.package]
edition = "2021"
license = "GPL-2.0-or-later"
version = "1.0.0-rc.1"
rust-version = "1.94"

[workspace.dependencies]
godot = { version = "0.5.5", features = ["api-4-7"] }
png = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"

# Robustness bot: optimized, but with overflow checks and debug_assert! enabled,
# so that any arithmetic that is not explicitly "wrapping" and overflows is a
# detected panic rather than silent behavior.
[profile.robustness]
inherits = "release"
overflow-checks = true
debug-assertions = true
