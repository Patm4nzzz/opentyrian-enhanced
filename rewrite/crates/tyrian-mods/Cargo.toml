[package]
name = "tyrian-mods"
description = "Mod loading and validation (single name-based format, ADR 0083)"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tyrian-mods"
path = "src/main.rs"

[dependencies]
tyrian-formats = { path = "../tyrian-formats" }
tyrian-sim = { path = "../tyrian-sim" }
# Tool only (preview sheets of `tyrian-mods catalog`).
tyrian-render = { path = "../tyrian-render" }
png.workspace = true
