[package]
name = "tyrian-godot"
description = "GDExtension: bridge between Godot 4 and the simulation core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { workspace = true }
tyrian-sim = { path = "../tyrian-sim" }
tyrian-formats = { path = "../tyrian-formats" }
tyrian-mods = { path = "../tyrian-mods" }
tyrian-render = { path = "../tyrian-render" }
# Unassisted driving for the campaign bot (tool, unused in game).
tyrian-dodge-bot = { path = "../tyrian-dodge-bot" }
# SoundFont synth + MIDI sequencer (MIT, ADR 0130).
rustysynth = "1.3.7"
# Tempo map of a .mid (loop point in seconds -> tick).
midly = { version = "0.5.3", default-features = false, features = ["std"] }

[dev-dependencies]
# Image check of the golden masters (playfield.rs, golden_image_tests).
tyrian-golden = { path = "../tyrian-golden" }
