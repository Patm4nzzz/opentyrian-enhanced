[package]
name = "tyrian-dodge-bot"
description = "Unassisted driver that dodges enemies and shots (read-only access to the published state), and a headless bench that measures the real difficulty"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "tyrian-dodge-bot"
path = "src/main.rs"

[dependencies]
tyrian-sim = { path = "../tyrian-sim" }
tyrian-formats = { path = "../tyrian-formats" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
