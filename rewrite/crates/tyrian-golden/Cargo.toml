[package]
name = "tyrian-golden"
description = "Compares the golden masters of the C version against the Rust core"
edition.workspace = true
license.workspace = true
version.workspace = true
# The reference command `cargo run -p tyrian-golden` remains the one for the golden masters.
default-run = "tyrian-golden"

[lib]
path = "src/lib.rs"

[[bin]]
name = "tyrian-golden"
path = "src/main.rs"

[[bin]]
name = "tyrian-replay"
path = "src/bin/replay.rs"

[[bin]]
name = "tyrian-write-references"
path = "src/bin/write_references.rs"

[dependencies]
tyrian-sim = { path = "../tyrian-sim" }
tyrian-formats = { path = "../tyrian-formats" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
# tests/campaign.rs: episode script (shop of the section) of the e1-shop campaign.
tyrian-formats = { path = "../tyrian-formats" }
