; Steam Deck controls profile (block 15, ADR 0051).
;
; Loaded by TyrianControls.install() when the SteamDeck=1 environment
; variable is present (Steam sets it on the console) and no
; user://controls.cfg exists yet; the controls screen (F9) then saves it
; to user://controls.cfg, which takes over.
;
; Format: Godot ConfigFile; <command>_buttons = Godot JoyButton indices
; (0 A, 1 B, 2 X, 3 Y, 6 Start, 9 L1, 10 R1, 11-14 D-pad up/down/left/right).
; The axes (left stick = analog movement, R2 = fire, L2 = bullet time) are
; the defaults from scripts/controls.gd and are not listed here. Player 1's
; keyboard stays the one from config.c:defaultKeySettings (not listed).
;
; Layout (C equivalents: player_movement.c, joystick[j].action[]):
;   left stick / D-pad   : movement
;   R2 or A              : fire                (action[0])
;   L2 or B              : fire switch         (action[1])
;   X                    : left sidekick       (action[2])
;   Y                    : right sidekick      (action[3])
;   R1 or Start          : in-level pause (R1 = button 5 in C); R1 = back (menu)
;   L1 or Back (View)    : in-game menu (L1 = button 4 in C, action[4]); L1 = confirm (menu)
; The rear paddles (L4, L5, R4, R5) are not seen by Godot: assign
; them in Steam Input ("Controller configuration") to A/B/X/Y.

[player1]

up_buttons=[11]
down_buttons=[12]
left_buttons=[13]
right_buttons=[14]
fire_buttons=[0]
change_fire_buttons=[1]
left_sidekick_buttons=[2]
right_sidekick_buttons=[3]
